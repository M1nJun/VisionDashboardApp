name: Demo

# Publishes the browsable demo to GitHub Pages.
#
# The demo is the same frontend as the real dashboard, built with `--mode demo` so that
# `src/api.ts` is swapped for `src/demo/`, which answers from data captured off a seeded
# server. There is no backend to deploy: the whole thing is static.
#
# Refreshing the data is a local step, not a CI one - it needs a running server and a
# seeded database:
#
#     python server/seed-demo.py && python web/demo/capture.py
#
# and the fixtures it writes are committed.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes one still in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build the demo
        run: npm run build:demo
        env:
          # Pages serves the site from the repository's own path.
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_BUILD_ID: ${{ github.sha }}

      # index.html is the one file Pages serves unhashed, and it caches it for ten
      # minutes. A page holding the stale copy fetches this past the cache, sees it does
      # not match the id compiled into itself, and reloads once.
      - name: Publish the build id
        run: echo '{"id":"${{ github.sha }}"}' > ../dist/demo/build-id.json

      # Pages has no SPA rewrite, so a deep link like /vision/A-1/EXAMPLE_C is a 404.
      # Serving the app as the 404 page hands those URLs to the router instead.
      - name: SPA fallback for deep links
        run: cp ../dist/demo/index.html ../dist/demo/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
