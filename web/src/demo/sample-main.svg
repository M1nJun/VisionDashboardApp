<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- A stand-in for a real inspection frame. The demo is public, so it carries a
       drawing of a cell edge rather than a photograph from the line. -->
  <defs>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3140"/>
      <stop offset="0.45" stop-color="#3d4453"/>
      <stop offset="1" stop-color="#22262f"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d97a6"/>
      <stop offset="0.3" stop-color="#c3ccd8"/>
      <stop offset="0.55" stop-color="#9aa4b3"/>
      <stop offset="0.8" stop-color="#cdd5e0"/>
      <stop offset="1" stop-color="#8d97a6"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="800" height="600" fill="url(#lit)"/>

  <!-- the pouch edge running across the frame -->
  <rect x="0" y="196" width="800" height="208" fill="url(#foil)"/>
  <rect x="0" y="196" width="800" height="5" fill="#e8eef6" opacity="0.75"/>
  <rect x="0" y="399" width="800" height="5" fill="#1b1f27" opacity="0.55"/>

  <!-- seal beads -->
  <g opacity="0.5" fill="#7c8697">
    <rect x="0" y="228" width="800" height="3"/>
    <rect x="0" y="252" width="800" height="3"/>
    <rect x="0" y="348" width="800" height="3"/>
    <rect x="0" y="372" width="800" height="3"/>
  </g>

  <!-- tab -->
  <rect x="318" y="120" width="164" height="82" fill="#b9c2ce"/>
  <rect x="318" y="120" width="164" height="6" fill="#e4eaf2"/>

  <!-- the flaw this frame is here to show -->
  <g filter="url(#soft)">
    <ellipse cx="486" cy="300" rx="26" ry="15" fill="#3a3f49" opacity="0.92"/>
    <ellipse cx="479" cy="296" rx="10" ry="6" fill="#20242c" opacity="0.85"/>
  </g>

  <g fill="#6f7887" opacity="0.35">
    <circle cx="150" cy="268" r="4"/>
    <circle cx="640" cy="352" r="3"/>
    <circle cx="228" cy="336" r="2.5"/>
  </g>

  <text x="20" y="576" font-family="monospace" font-size="19" fill="#aab3c2" opacity="0.55">
    EXAMPLE FRAME · not a photograph from the line
  </text>
</svg>
