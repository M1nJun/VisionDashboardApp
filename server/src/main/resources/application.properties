spring.application.name=VisionDashboardServer
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/dashboard

# connectionTimeZone=LOCAL + preserveInstants=false: every timestamp in this schema is
# factory wall-clock time, written and read by processes on the same PC. Pinning a zone
# instead makes the driver shift values whenever the PC's zone differs from the pinned
# one, which reads back as every agent being hours stale - i.e. permanently OFFLINE.
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:visiondash}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=LOCAL&preserveInstants=false
spring.datasource.username=${DB_USER:vision_app}
# No default: a password committed to a repository is a password everybody has.
# run-server.cmd sets these on the central PC; set them in your shell for a local run.
spring.datasource.password=${DB_PASSWORD}

# Ingest bursts and dashboard polls share one JVM, so the pool is sized for both
# rather than left at the default 10 - a slow detail query must not be able to
# starve event intake.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:24}
spring.datasource.hikari.minimum-idle=4
spring.datasource.hikari.connection-timeout=5000

# Nulls stay in the response on purpose: a line with no production reference sends
# production:null rather than dropping the key, so a client can tell "no data" apart
# from "field I forgot to handle".

visiondash.heartbeat.port=${HEARTBEAT_PORT:6002}
# Empty means "use the copy packaged in the jar"; point this at a directory to
# override the catalog without a rebuild.
visiondash.catalog.dir=${CATALOG_DIR:}

logging.level.com.visiondash=INFO
